name: Update changelog

on:
  push:
    branches: [main]

jobs:
  changelog:
    # Skip the run this workflow's own commit triggers, to avoid a loop
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate CHANGELOG.md and README.md
        run: python3 scripts/update_changelog.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md
          git diff --cached --quiet || git commit -m "chore: update changelog [skip ci]"
          git push
